name: table_companion
description: "Open-source offline board game companion."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.2.0+3

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.2
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.3
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1


flutter:

  uses-material-design: true




  assets:
    - assets/community/
    - assets/fonts/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf

    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2.ttf

    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols.ttf
