name: amiludo
description: "Open-source offline board game companion."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.4.0+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^18.1.2
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  wakelock_plus: ^1.8.2
  sensors_plus: ^7.1.1
  intl: any
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.3
  http: ^1.6.0
  hugeicons: ^4.4.0
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  cryptography: ^2.9.0
  archive: ^4.6.0
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1


flutter:

  uses-material-design: true
  generate: true




  assets:
    - assets/brand/
    - assets/cards/
    - assets/community/
    - assets/fonts/
    - assets/generators/
  fonts:
    - family: LilGrotesk
      fonts:
        - asset: assets/fonts/LilGrotesk-Regular.ttf
        - asset: assets/fonts/LilGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/LilGrotesk-Bold.ttf
          weight: 700
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Medium.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf

    - family: NotoSansSymbols2
      fonts:
        - asset: assets/fonts/NotoSansSymbols2.ttf

    - family: NotoSansSymbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols.ttf
